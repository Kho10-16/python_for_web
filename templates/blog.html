{% extends 'layout.html' %} {% block content %}
<div class="container">
  <h1>博客</h1>
  <a href="{{ url_for('new_post') }}">✏️ 写新文章</a>

  {% if posts %}
    {% for post in posts|reverse %}
    <div class="post">
      <h2>{{ post.title }}</h2>
      <p class="post-content">{{ post.content }}</p>
      <small>文章编号 #{{ post.id }}</small>
            <a href="{{ url_for('edit_post', post_id=post.id) }}">编辑</a>
            <form action="{{ url_for('delete_post', post_id=post.id) }}"
                method="POST" class="inline-form"
                onsubmit="return confirm('确定要删除这篇文章吗？')">
                <button type="submit">删除</button>
            </form>
    </div>
    {% endfor %}
  {% else %}
    <p>还没有文章</p>
  {% endif %}
</div>
{% endblock %}
