{% extends 'layout.html' %} {% block content %}
<div class="container">
  <h1>{{ title }}</h1>
  <form method="POST">
    <div>
      <input type="text" name="title" placeholder="标题" required
             value="{{ post.title if post else '' }}" />
    </div>
    <div>
      <textarea name="content" rows="8" placeholder="内容" required>{{ post.content if post else '' }}</textarea>
    </div>
    <div>
      <button type="submit">{{ '保存修改' if post else '发布' }}</button>
    </div>
  </form>
</div>
{% endblock %}
